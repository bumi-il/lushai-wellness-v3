name: Wellness preview on GitHub Pages

on:
  push:
    branches:
      - redesign/treatments-page

permissions:
  contents: read

concurrency:
  group: contact-pages-preview
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/redesign/treatments-page'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the preview branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test contact submissions and treatment options
        run: npm test

      - name: Build for the repository URL
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: npm run build -- --base "/$REPOSITORY_NAME/"

      - name: Prepare direct links for static hosting
        run: node scripts/prepare-pages-preview.mjs

      - name: Install Chromium for responsive checks
        run: npx playwright install --with-deps chromium

      - name: Verify treatments in desktop and mobile browsers
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: npm run test:browser

      - name: Upload browser screenshots and checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: treatments-browser-review
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the built site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/redesign/treatments-page'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Publish the preview
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
