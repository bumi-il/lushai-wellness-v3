name: Contact preview on GitHub Pages

on:
  push:
    branches:
      - redesign/contact-page

permissions:
  contents: read

concurrency:
  group: contact-pages-preview
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/redesign/contact-page'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the preview branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test contact submissions
        run: npm test

      - name: Build for the repository URL
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: npm run build -- --base "/$REPOSITORY_NAME/"

      - name: Prepare direct links for static hosting
        run: node scripts/prepare-pages-preview.mjs

      - name: Upload the built site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/redesign/contact-page'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Publish the preview
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
